version: "3.9"

services:

  # ── Backend — FastAPI ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sf_backend
    ports:
      - "8000:8000"
    volumes:
      # Share temp directories with host for uploads/outputs
      - sf_uploads:/tmp/sovereignforge/uploads
      - sf_outputs:/tmp/sovereignforge/outputs
      - sf_network_log:/tmp/sovereignforge
      # Mount Docker socket so backend can spawn sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - TESSERACT_CMD=/usr/bin/tesseract
    networks:
      - sovereignnet
    depends_on: []
    restart: unless-stopped

  # ── Frontend — Next.js ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sf_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    networks:
      - sovereignnet
    depends_on:
      - backend
    restart: unless-stopped

  # ── Sovereignty Monitor — mitmproxy ──
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: sf_mitmproxy
    command: >
      mitmdump
      --listen-host 0.0.0.0
      --listen-port 8080
      --scripts /addons/mitmproxy_addon.py
    volumes:
      - ./sovereignty:/addons
      - sf_network_log:/tmp/sovereignforge
    ports:
      - "8080:8080"
    networks:
      - sovereignnet
    restart: unless-stopped

volumes:
  sf_uploads:
  sf_outputs:
  sf_network_log:

networks:
  sovereignnet:
    driver: bridge
